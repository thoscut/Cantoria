# Release archive of a tagged version (docs/release.md):
#
# 1. The whole CI (ci.yml) runs for the tag. Its job "archive" builds the
#    archive with tools/release/package.sh with all checks of a final
#    version (tag, clean checkout, CHANGELOG entry, migrations frozen in
#    ReleasedMigrationsTest, info.xml against the pinned app store schema,
#    reuse lint over the content), and the integration tests install
#    exactly that archive. Nothing below runs unless all of it is green.
# 2. A second, independent job builds the archive again on a fresh runner
#    and compares the bytes (reproducible build).
# 3. For a tag, a draft release with the archive and SHA256SUMS is created,
#    so that the archive outlives the artifact and anyone can compare the
#    archive of the app store with it (tools/release/compare.sh).
#
# Signing needs the private key and stays with a maintainer: they sign
# this archive with tools/release/sign.sh, which builds nothing.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  rebuild:
    name: Build again and compare (reproducible build)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # The image of the job "archive" in ci.yml, pinned by digest
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    steps:
      - name: Install job tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libxml2-utils python3-venv >/dev/null
          python3 -m venv /opt/reuse
          /opt/reuse/bin/pip install --quiet --disable-pip-version-check reuse==6.3.0
          ln -s /opt/reuse/bin/reuse /usr/local/bin/reuse
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Another path than the first build
          path: rebuild
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/rebuild"
      - name: Build the archive (no npm cache)
        env:
          MODE: ${{ github.ref_type == 'tag' && 'release' || 'unreleased' }}
        working-directory: rebuild
        run: |
          if [ "$MODE" = release ]; then
            tools/release/package.sh
          else
            tools/release/package.sh --unreleased
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive
          path: ${{ runner.temp }}/ci
      - name: Compare with the archive of the CI
        run: |
          cd "$RUNNER_TEMP/ci"
          sha256sum -c SHA256SUMS
          for archive in cantoria-*.tar.gz; do
            cmp "$archive" "$GITHUB_WORKSPACE/rebuild/build/release/$archive"
          done

  draft:
    name: Draft release with the archive
    needs: [ci, rebuild]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the draft release; nothing else is written
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive
          path: ${{ runner.temp }}/ci
      - name: Create the draft release (unsigned archive and SHA256SUMS)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/ci"
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes "Unsigned release archive of $TAG as built and tested by the CI (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The archive in the app store differs from it only by appinfo/signature.json: tools/release/compare.sh shows this." \
            cantoria-*.tar.gz SHA256SUMS
