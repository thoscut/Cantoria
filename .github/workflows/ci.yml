# Continuous integration of the Cantoria app on GitHub Actions.
#
# Every job runs in a container image pinned by its digest (the tag is noted
# for reading; the digest decides) and installs what it needs, so it does
# not depend on the software of the runner host. Actions are pinned to the
# commit of a release (the version is noted next to the hash). reuse is
# installed with pip in fixed versions with the hashes of all its
# dependencies (tools/release/reuse-requirements.txt). To move an image to a
# newer build, look up the digest of the tag (e.g. `docker buildx imagetools
# inspect node:24`) and replace it everywhere it occurs, also in
# release.yml.
#
# The job "changes" decides whether code changed: documentation alone
# (docs/, *.md, tools/screenshots/, the GitHub templates) skips build and
# tests, while the checks of the documentation and of REUSE always run.
# The job "ci-ok" ("CI result") waits for all jobs and is red when one
# failed or was cancelled, or when one was skipped although code changed; it
# is the one required check of the branch protection (docs/release.md), so
# a pull request with documentation alone is not left waiting.
#
# The job "archive" builds the release archive with tools/release/package.sh
# on every run with code; the integration tests install that archive, so
# they test exactly what is handed out. The workflow Release (release.yml)
# calls this workflow for a tag and continues only when all of it is green.
#
# Forgejo Actions (e.g. Codeberg) reads .github/workflows as well when a
# repository has no .forgejo/workflows; there the runner needs the label
# "ubuntu-latest". JavaScript actions such as actions/checkout run inside the
# job container on Forgejo and therefore need Node.js there; the PHP jobs
# install it first (GitHub brings its own).

name: CI

on:
  # Every push and pull request, also with documentation alone (the job
  # "changes" decides what runs), so that the required check always reports
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # From the workflow Release, for a tag
  workflow_call:

# A newer push to a pull request cancels the older run, so runner minutes
# are spent on the current state only. On main every commit has a group of
# its own: a concurrency group keeps only one waiting run and cancels the
# one before it, so a shared group would leave a commit without a result
# when three merges come quickly. The workflow and the event are part of the
# group (in a called workflow github.workflow is the caller's name, e.g.
# "Release"), so that a manual run or the workflow Release for a commit of
# main never cancels the push run of the same commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_ALLOW_SUPERUSER: '1'
  COMPOSER_NO_INTERACTION: '1'
  DEBIAN_FRONTEND: noninteractive

jobs:
  changes:
    # Code changed, or documentation alone? For a pull request the merge
    # commit against the current base, for a push to main the commits of the
    # push; a manual run, a tag or a push whose base is unknown counts as
    # code (.github/scripts/code-changed.sh).
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base of the push (github.event.before) must be in the history
          fetch-depth: 0
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Decide which jobs run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: sh .github/scripts/code-changed.sh "$EVENT" "$BEFORE" >> "$GITHUB_OUTPUT"

  appinfo:
    # The app store refuses a release whose appinfo/info.xml does not match
    # its schema, e.g. a wrong order of elements. The schema is pinned with
    # its checksum (tools/release/check-appinfo.sh).
    name: App info against the app store schema
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs ca-certificates curl libxml2-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate appinfo/info.xml
        run: tools/release/check-appinfo.sh

  reuse:
    # Every file states its copyright and license (https://reuse.software),
    # as in Nextcloud's own apps; see "Licensing (REUSE)" in tests/README.md.
    # Always, also for documentation alone (new documents and screenshots).
    # The job "archive" checks the content of the release archive with the
    # same reuse.
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install reuse (pinned with hashes)
        run: tools/release/install-reuse.sh
      - name: Check copyright and license information (reuse lint)
        run: reuse lint

  docs:
    # Always, also for documentation alone: equal headings in the German and
    # English guides, links and anchors, screenshots that exist
    # (src/__tests__/docs.test.ts), and that the table of promises in
    # SECURITY.md names only tests that exist (src/__tests__/security.test.ts).
    # When code changed, the job "node" runs them again with all others.
    name: Documentation (headings, links, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the documentation
        run: npx vitest run src/__tests__/docs.test.ts src/__tests__/security.test.ts

  php-lint:
    name: PHP lint ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            image: php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
          - php: '8.3'
            image: php:8.3-cli@sha256:600bce7c7acf524756e5aac989f4a763aed709960d7326970bb670f46efee53a
          - php: '8.4'
            image: php:8.4-cli@sha256:7e7413ed31b8c42b31c939cc83b3758b1cd618f7bf3803f5a0c39f98d4adcbee
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint all PHP files
        run: find appinfo lib templates tests tools/ci -name '*.php' -print0 | xargs -0 -n1 php -l

  composer:
    name: Composer (validate, audit)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates libzip-dev libicu-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the PHP extensions the app requires (composer.json)
        run: sh .github/scripts/install-php-extensions.sh
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - name: Validate composer.json and lock file
        run: composer validate --no-check-publish
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Composer's download cache; composer install still installs exactly the lock files
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock', 'vendor-bin/*/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress
      - name: Audit dependencies of the app and the tools
        run: |
          composer audit
          composer bin all audit

  psalm:
    name: Psalm
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates libzip-dev libicu-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the PHP extensions the app requires (composer.json)
        run: sh .github/scripts/install-php-extensions.sh
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Composer's download cache; composer install still installs exactly the lock files
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock', 'vendor-bin/*/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress
      - name: Static analysis
        run: vendor/bin/psalm --no-cache --no-progress --threads=2 --output-format=compact
      - name: Static analysis of the unit tests (psalm-tests.xml)
        run: vendor/bin/psalm -c psalm-tests.xml --no-cache --no-progress --threads=2 --output-format=compact

  cs-check:
    name: Coding standard
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The lowest supported PHP version, as recommended by PHP-CS-Fixer
      image: php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates libzip-dev libicu-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the PHP extensions the app requires (composer.json)
        run: sh .github/scripts/install-php-extensions.sh
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Composer's download cache; composer install still installs exactly the lock files
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock', 'vendor-bin/*/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress
      - name: Check the coding standard
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

  openapi:
    # openapi.json describes the API for agents (OCS, api/v1). It is generated
    # from lib/ResponseDefinitions.php and the controllers and must be
    # committed in the state the code describes.
    name: OpenAPI description up to date
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates libzip-dev libicu-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the PHP extensions the app requires (composer.json)
        run: sh .github/scripts/install-php-extensions.sh
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Composer's download cache; composer install still installs exactly the lock files
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock', 'vendor-bin/*/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress
      - name: Generate openapi.json (nextcloud/openapi-extractor)
        run: composer run openapi
      - name: openapi.json is committed and current
        run: |
          if [ -n "$(git status --porcelain -- 'openapi*.json')" ]; then
            git status --porcelain -- 'openapi*.json'
            git --no-pager diff -- openapi.json | head -n 200
            echo "openapi.json is not up to date: run 'composer run openapi' and commit the result." >&2
            exit 1
          fi
          git diff --exit-code -- openapi.json

  phpunit:
    name: Unit tests ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            image: php:8.2-cli@sha256:a76ea7d3dd8f65eefff85e9c883f4d146808e0075c30ae6bccbb2a3753d373b8
          - php: '8.3'
            image: php:8.3-cli@sha256:600bce7c7acf524756e5aac989f4a763aed709960d7326970bb670f46efee53a
            # line coverage of lib/ with pcov, as a summary of the job and an artifact
            coverage: true
          - php: '8.4'
            image: php:8.4-cli@sha256:7e7413ed31b8c42b31c939cc83b3758b1cd618f7bf3803f5a0c39f98d4adcbee
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates libzip-dev libicu-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the PHP extensions the app requires (composer.json)
        run: sh .github/scripts/install-php-extensions.sh
      - name: Install pcov for the coverage
        if: matrix.coverage
        run: pecl install pcov >/dev/null && docker-php-ext-enable pcov
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Composer's download cache; composer install still installs exactly the lock files
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock', 'vendor-bin/*/composer.lock') }}
      - name: Install dependencies
        run: composer install --no-progress
      - name: Unit tests (without Nextcloud server)
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit -c tests/phpunit.xml --colors=never
      - name: Unit tests with coverage of lib/
        if: matrix.coverage
        run: |
          vendor/bin/phpunit -c tests/phpunit.xml --colors=never \
            --coverage-clover build/coverage/clover.xml --coverage-text=build/coverage/summary.txt --only-summary-for-coverage-text
          {
            echo '### Coverage of lib/ by the unit tests'
            echo
            echo '```'
            cat build/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.coverage
        with:
          name: coverage-php
          path: build/coverage/
          retention-days: 14

  npm-audit:
    # A job of its own, so that a newly published advisory does not hide the
    # results of lint and tests. Build tools (devDependencies) are not
    # shipped; their reports are handled through the dependency updates
    # (.github/dependabot.yml). npm audit reads the lock files only.
    name: Audit the npm dependencies of the archive and the MCP server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies in the release archive
        run: npm audit --omit=dev --audit-level=moderate
      - name: Runtime dependencies of the MCP server (tools/mcp)
        working-directory: tools/mcp
        run: npm audit --omit=dev --audit-level=moderate

  node:
    name: Frontend (lint, styles, types, unit tests, build, translations)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Node.js and npm versions as required by "engines" in package.json
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # npm's download cache; npm ci still installs exactly the lock file
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        # Without the install scripts of the dependencies, as for the archive
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Stylelint
        # Styles of the Vue components with Nextcloud's shared configuration
        run: npm run stylelint
      - name: Type check
        # vue-tsc: TypeScript and the templates of the Vue components
        run: npm run typecheck
      - name: Unit tests with coverage of src/
        # vitest: score logic, catalog filters, text references, start parameters, durations,
        # maintenance helpers, MXL limits, SVG cleaning, focus voice emphasis,
        # start page labels in singular and plural, access to the inbox,
        # mounted components; the coverage goes into the summary of the job
        # (bash: pipefail, so a failing test is not hidden by tee)
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage | tee build-coverage.txt
          {
            echo '### Coverage of src/ by the unit tests'
            echo
            echo '```'
            sed -n '/Coverage summary/,/^=*$/p' build-coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm build-coverage.txt
      - name: Build
        run: npm run build
      - name: Translations complete
        # Fails when a source string has no German translation.
        run: npm run l10n
      - name: Translation files up to date
        run: |
          if [ -n "$(git status --porcelain -- l10n)" ]; then
            git --no-pager diff --stat -- l10n
            echo "l10n/ is not up to date: run 'npm run l10n' and commit the result." >&2
            exit 1
          fi

  archive:
    # The release archive (tools/release/package.sh): only committed files,
    # the build without install scripts of the dependencies, the license
    # texts, `reuse lint` over the content. For a tag (workflow Release) with
    # all checks of a final version, otherwise with --unreleased (no tag,
    # CHANGELOG entry or frozen migration needed). The integration tests
    # install this archive.
    name: Release archive
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    steps:
      - name: Install job tools
        # xmllint for the schema of info.xml, python3-venv for reuse
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libxml2-utils python3-venv >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install reuse (pinned with hashes) for the content of the archive
        run: tools/release/install-reuse.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Build the archive
        env:
          MODE: ${{ github.ref_type == 'tag' && 'release' || 'unreleased' }}
        run: |
          if [ "$MODE" = release ]; then
            tools/release/package.sh
          else
            tools/release/package.sh --unreleased
          fi
          cd build/release && sha256sum cantoria-*.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive
          path: build/release/
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  mcp:
    # The MCP server for agents (tools/mcp): own package and lock file, not
    # part of the app or its release archive.
    name: MCP server (build, tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    defaults:
      run:
        working-directory: tools/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test (node:test, HTTP mocked)
        run: npm test

  ci-ok:
    # The one required check (docs/release.md): green only when every job
    # passed, or when documentation alone changed and the jobs for code were
    # skipped. Runs also when a job failed or was cancelled (always()), so
    # that it is never skipped itself: a branch protection takes a skipped
    # required check as passed.
    name: CI result
    if: always()
    needs: [changes, reuse, docs, appinfo, php-lint, composer, psalm, cs-check, openapi, phpunit, npm-audit, node, archive, mcp, integration, upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:24@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: All jobs passed (or were skipped for documentation alone)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-result.mjs

  upgrade:
    # The upgrade from the base branch (M1): Nextcloud 35 with MariaDB and
    # with PostgreSQL gets the app as it is on the base (for a pull request
    # its base commit, for a push to main the commit before), runs the
    # integration tests of that version (they leave the demo data and what
    # the tests made), then the release archive of this run replaces the app
    # and tools/ci/upgrade-check.sh runs the upgrade and the migrations and
    # checks that no table lost rows. So a new migration meets data before
    # it reaches an instance.
    name: Upgrade from the base branch, ${{ matrix.database }}
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        database: ['MariaDB', 'PostgreSQL']
    container:
      image: php:8.3-cli@sha256:600bce7c7acf524756e5aac989f4a763aed709960d7326970bb670f46efee53a
    services:
      mariadb:
        image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        env:
          # Throwaway database of this job only
          MARIADB_ROOT_PASSWORD: nextcloud-ci
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          # Throwaway database of this job only
          POSTGRES_PASSWORD: nextcloud-ci
          POSTGRES_DB: nextcloud
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEXTCLOUD_ROOT: /opt/nextcloud
      NEXTCLOUD: '35'
    defaults:
      run:
        shell: bash
    steps:
      - name: Install job tools and the PHP extensions Nextcloud needs
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl bzip2 ca-certificates libpng-dev libfreetype-dev libzip-dev libicu-dev libpq-dev >/dev/null
          docker-php-ext-configure gd --with-freetype >/dev/null
          docker-php-ext-install -j"$(nproc)" gd intl pdo_mysql pdo_pgsql zip >/dev/null
          echo 'memory_limit = 1G' > /usr/local/etc/php/conf.d/zz-ci.ini
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the base commit must be in the history
          fetch-depth: 0
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check out the base in a worktree
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-}"
          if [ -z "$base" ] && [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            base="$BEFORE"
          fi
          # a manual run or a tag: the commit before
          base="${base:-$(git rev-parse HEAD^)}"
          git worktree add "$RUNNER_TEMP/base" "$base"
          echo "base: $(git -C "$RUNNER_TEMP/base" log -1 --oneline)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive
          path: ${{ runner.temp }}/release
      - name: Build the app, demo data and MCP server of the base
        working-directory: ${{ runner.temp }}/base
        run: |
          tools/release/package.sh --unreleased
          node tools/demo/build.mjs
          npm ci --prefix tools/mcp --no-audit --no-fund
          npm run build --prefix tools/mcp
      - name: Download Nextcloud and check its checksum
        run: |
          tarball="latest-$NEXTCLOUD.tar.bz2"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://download.nextcloud.com/server/releases/$tarball.sha512"
          curl -fsSLO "https://download.nextcloud.com/server/releases/$tarball"
          grep " $tarball\$" "$tarball.sha512" | sha512sum -c -
          tar -xjf "$tarball" -C "$(dirname "$NEXTCLOUD_ROOT")"
      - name: Install Nextcloud with ${{ matrix.database }}
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          admin_pass="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
          case "$DATABASE" in
            MariaDB) database=(--database=mysql --database-host=mariadb --database-port=3306 --database-user=root) ;;
            PostgreSQL) database=(--database=pgsql --database-host=postgres --database-port=5432 --database-user=postgres) ;;
            *) echo "unknown database $DATABASE" >&2; exit 1 ;;
          esac
          php "$NEXTCLOUD_ROOT/occ" maintenance:install --no-interaction \
            "${database[@]}" --database-name=nextcloud --database-pass=nextcloud-ci \
            --admin-user=admin --admin-pass="$admin_pass" \
            --data-dir="$NEXTCLOUD_ROOT/data"
      - name: Install the base version and run its integration tests
        run: |
          archives=("$RUNNER_TEMP"/base/build/release/cantoria-*.tar.gz)
          [ "${#archives[@]}" = 1 ]
          tar -xzf "${archives[0]}" -C "$NEXTCLOUD_ROOT/apps" --no-same-owner
          php "$NEXTCLOUD_ROOT/occ" app:enable cantoria
          bash "$RUNNER_TEMP/base/tools/ci/integration-demo.sh" "$NEXTCLOUD_ROOT"
      - name: Upgrade to the release archive of this run
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          archives=(cantoria-*.tar.gz)
          [ "${#archives[@]}" = 1 ]
          bash "$GITHUB_WORKSPACE/tools/ci/upgrade-check.sh" "$NEXTCLOUD_ROOT" "$RUNNER_TEMP/release/${archives[0]}" demo-librarian

  integration:
    # The integration tests in tests/Integration against a freshly installed
    # Nextcloud, the app from the release archive of the job "archive" and
    # the public demo data (tools/demo). The oldest and the newest supported
    # Nextcloud (appinfo/info.xml), each with MariaDB and with PostgreSQL
    # (the database of Nextcloud All-in-One), and the oldest with MySQL 8.0.
    # All database services start in every job; the matrix chooses which one
    # Nextcloud uses.
    name: Integration tests, Nextcloud ${{ matrix.nextcloud }}, ${{ matrix.database }}
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ['33', '35']
        database: ['MariaDB', 'PostgreSQL']
        # MySQL 8.0, the oldest database info.xml names, on the oldest Nextcloud (M2)
        include:
          - nextcloud: '33'
            database: MySQL
    container:
      image: php:8.3-cli@sha256:600bce7c7acf524756e5aac989f4a763aed709960d7326970bb670f46efee53a
    services:
      mariadb:
        # Long-term support release, as on the acceptance instance
        image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        env:
          # Throwaway database of this job only
          MARIADB_ROOT_PASSWORD: nextcloud-ci
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          # Throwaway database of this job only
          MYSQL_ROOT_PASSWORD: nextcloud-ci
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pnextcloud-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        # As in Nextcloud All-in-One
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          # Throwaway database of this job only
          POSTGRES_PASSWORD: nextcloud-ci
          # Nextcloud expects the database to exist (MariaDB creates it itself)
          POSTGRES_DB: nextcloud
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEXTCLOUD_ROOT: /opt/nextcloud
    defaults:
      run:
        # bash with -e and -o pipefail
        shell: bash
    steps:
      - name: Install job tools and the PHP extensions Nextcloud needs
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl bzip2 ca-certificates libpng-dev libfreetype-dev libzip-dev libicu-dev libpq-dev >/dev/null
          # FreeType: Nextcloud draws the letter avatar of a new account
          docker-php-ext-configure gd --with-freetype >/dev/null
          docker-php-ext-install -j"$(nproc)" gd intl pdo_mysql pdo_pgsql zip >/dev/null
          echo 'memory_limit = 1G' > /usr/local/etc/php/conf.d/zz-ci.ini
          php -r 'foreach (["gd", "intl", "pdo_mysql", "pdo_pgsql", "zip"] as $e) { extension_loaded($e) || exit(1); } function_exists("imagettfbbox") || exit(1);'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # As required by "engines" in package.json; the demo build needs 22 or newer
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/mcp/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archive
          path: ${{ runner.temp }}/release
      - name: Build the MCP server for the agent run (tools/mcp)
        run: |
          npm ci --prefix tools/mcp --no-audit --no-fund
          npm run build --prefix tools/mcp
      - name: Build the demo data
        run: node tools/demo/build.mjs
      - name: Look up the checksum of Nextcloud ${{ matrix.nextcloud }}
        # The small checksum file names the current release; its hash is the
        # cache key, so a new point release is downloaded once and then cached.
        id: nextcloud
        env:
          TARBALL: latest-${{ matrix.nextcloud }}.tar.bz2
        run: |
          mkdir -p ~/.cache/nextcloud
          cd ~/.cache/nextcloud
          curl -fsSL -o "$TARBALL.sha512" "https://download.nextcloud.com/server/releases/$TARBALL.sha512"
          # The file may list more than one archive: take the line of ours
          sha512="$(grep " $TARBALL\$" "$TARBALL.sha512" | cut -d' ' -f1)"
          [ -n "$sha512" ]
          echo "sha512=$sha512" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nextcloud/latest-${{ matrix.nextcloud }}.tar.bz2
          key: nextcloud-${{ matrix.nextcloud }}-${{ steps.nextcloud.outputs.sha512 }}
      - name: Download Nextcloud ${{ matrix.nextcloud }} (unless cached) and check its checksum
        env:
          TARBALL: latest-${{ matrix.nextcloud }}.tar.bz2
        run: |
          cd ~/.cache/nextcloud
          [ -f "$TARBALL" ] || curl -fsSLO "https://download.nextcloud.com/server/releases/$TARBALL"
          grep " $TARBALL\$" "$TARBALL.sha512" | sha512sum -c -
          tar -xjf "$TARBALL" -C "$(dirname "$NEXTCLOUD_ROOT")"
      - name: Install Nextcloud with ${{ matrix.database }}
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          admin_pass="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
          case "$DATABASE" in
            MariaDB) database=(--database=mysql --database-host=mariadb --database-port=3306 --database-user=root) ;;
            MySQL) database=(--database=mysql --database-host=mysql --database-port=3306 --database-user=root) ;;
            PostgreSQL) database=(--database=pgsql --database-host=postgres --database-port=5432 --database-user=postgres) ;;
            *) echo "unknown database $DATABASE" >&2; exit 1 ;;
          esac
          php "$NEXTCLOUD_ROOT/occ" maintenance:install --no-interaction \
            "${database[@]}" --database-name=nextcloud --database-pass=nextcloud-ci \
            --admin-user=admin --admin-pass="$admin_pass" \
            --data-dir="$NEXTCLOUD_ROOT/data"
          php "$NEXTCLOUD_ROOT/occ" status
          php "$NEXTCLOUD_ROOT/occ" config:system:get dbtype
      - name: Install the app from the release archive
        # The archive of the job "archive", unpacked into apps/ as Nextcloud
        # does with an archive from the app store. The app has no runtime
        # dependencies from Composer: "require" in composer.json holds only
        # the plugin for the tools in vendor-bin/, and Nextcloud loads the
        # app's classes itself.
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS
          archives=(cantoria-*.tar.gz)
          [ "${#archives[@]}" = 1 ]
          tar -xzf "${archives[0]}" -C "$NEXTCLOUD_ROOT/apps" --no-same-owner
          php "$NEXTCLOUD_ROOT/occ" app:enable cantoria
          for app in cantoria notifications; do
            php "$NEXTCLOUD_ROOT/occ" app:list --enabled | grep -E "^  - $app:"
          done
      - name: Integration tests and the agent run with the demo data
        # Step 7 of the script needs Nextcloud behind a web server: without
        # NC_URL it starts PHP's built-in server (php -S 127.0.0.1:8080) for
        # the Nextcloud directory and stops it at the end.
        run: bash tools/ci/integration-demo.sh "$NEXTCLOUD_ROOT"
